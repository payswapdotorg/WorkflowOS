name: Resolve Step 0 Architecture Clarifications

on:
  push:
    branches:
      - chore/resolve-step0-architecture-blockers
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/resolve-step0-architecture-blockers
          fetch-depth: 0

      - name: Patch frozen architecture specifications
        shell: python
        run: |
          from pathlib import Path

          architecture = Path("spec/architecture.md")
          text = architecture.read_text()

          replacements = [
              ("""The initial modules are:\n\n```text\n/auth\n/users\n/organizations\n/projects\n/specifications\n/requirements\n/work-items\n/workflows\n/agent-runs\n/reviews\n/github\n/llm\n/agents\n/notifications\n/audit\n```""", """The frozen module ownership boundaries are documented below. The module paths are:\n\n```text\n/auth\n/users\n/organizations\n/projects\n/architecture\n/specifications\n/requirements\n/work-items\n/workflows\n/verification\n/reviews\n/llm\n/agents\n/github\n/notifications\n/audit\n```"""),
              ("""* associated pull request\n* execution history""", """* associated pull requests\n* active implementation pull request (at most one)\n* execution history"""),
              ("""# 13. Work Item State Machine\n\nThe canonical workflow states are:\n\n```text\nDRAFT\n  ↓\nREADY\n  ↓\nASSIGNED\n  ↓\nIMPLEMENTING\n  ↓\nPR_OPEN\n  ↓\nVERIFYING\n  ↓\nARCHITECT_REVIEW\n  ↓\nAPPROVED\n  ↓\nMERGED\n  ↓\nVERIFIED\n```\n\nAlternative states include:\n\n```text\nCHANGES_REQUESTED\nIMPLEMENTATION_BLOCKED\nVERIFICATION_FAILED\nARCHITECTURE_CHANGE_REQUIRED\n```\n\nThe Workflow Engine owns these state transitions.\n\nExternal agents must not directly mutate workflow state outside authorized APIs.""", """# 13. Work Item State Machine\n\nThe canonical workflow states and legal transitions are:\n\n```text\nDRAFT\n  ↓\nREADY\n  ↓\nASSIGNED\n  ↓\nIMPLEMENTING\n  ↓\nPR_OPEN\n  ↓\nVERIFYING\n  ├── VERIFICATION_FAILED → IMPLEMENTING\n  └── ARCHITECT_REVIEW\n          ├── CHANGES_REQUESTED → IMPLEMENTING\n          ├── ARCHITECTURE_CHANGE_REQUIRED → ARCHITECTURE_CHANGE_REQUEST\n          └── APPROVED → MERGED → VERIFIED\n```\n\n`IMPLEMENTATION_BLOCKED` may occur during `ASSIGNED`, `IMPLEMENTING`, or `VERIFYING` and returns to `IMPLEMENTING` when resolved.\n\n`ARCHITECTURE_CHANGE_REQUIRED` is terminal for the current implementation attempt until the architecture change is resolved.\n\nThe Workflow Engine owns the workflow state machine and all legal state transitions. External agents must not directly mutate workflow state outside authorized APIs.\n\nState transitions are deterministic and idempotent."""),
              ("""# 9. Architecture Management\n\nArchitecture is a versioned project artifact.""", """# 9. Architecture Management\n\nThe `/architecture` module owns Architecture, Architecture Versions, Architecture Decisions, and Architecture Change Requests.\n\nArchitecture is a versioned project artifact."""),
              ("""A new version is required for architectural changes.""", """A new immutable architecture version is created only from an approved Architecture Change Request."""),
              ("""# 16. LLM Gateway\n\nAll LLM providers are accessed through a provider-independent interface.""", """# 16. LLM Gateway\n\nThe `/llm` module owns the LLM Gateway, architect role execution, and Work-order generation.\n\nAll LLM providers are accessed through a provider-independent interface."""),
              ("""# 21. GitHub Integration\n\nGitHub is the authoritative source for repository state.""", """# 21. GitHub Integration\n\nThe `/github` module owns the GitHub App, GitHub webhooks, Pull Requests, and CI integration. GitHub Actions is an external CI provider.\n\nGitHub is the authoritative source for repository state."""),
              ("""# 23. Pull Requests\n\nEach implementation PR is associated with one or more WorkflowOS work items.""", """# 23. Pull Requests\n\nA work item may have multiple PRs over its lifetime and must preserve historical PR associations. A work item may have only one active implementation PR at a time. A PR may implement one or more work items, provided each work item is explicitly associated with that PR."""),
              ("""# 24. Verification\n\nVerification is separate from architecture review.""", """# 24. Verification\n\nThe `/verification` module owns verification runs, verification results, evidence, acceptance-criterion evaluation, and evidence-to-criterion mapping. The `/github` module owns GitHub integration and CI result ingestion.\n\nVerification is separate from architecture review."""),
              ("""# 25. Verification Engine\n\nThe Verification Engine maps objective evidence to acceptance criteria.""", """# 25. Verification Engine\n\nThe Verification Engine is implemented within `/verification`, which owns verification semantics and evidence-to-criterion mapping. `/github` only ingests CI provider results."""),
          ]

          for old, new in replacements:
              if old not in text:
                  continue
              text = text.replace(old, new, 1)

          ownership = """\n## Frozen module ownership\n\nThe frozen module boundaries are:\n\n| Module | Responsibility |\n|---|---|\n| `/architecture` | Architecture Management; ADRs; Architecture Change Requests; Architecture Versions |\n| `/specifications` | specification documents and specification lifecycle |\n| `/requirements` | Requirements; Acceptance Criteria |\n| `/work-items` | Work Items; Work Item Dependencies; Work Order state |\n| `/workflows` | workflow state machine; legal state transitions; orchestration |\n| `/verification` | verification; evidence; criterion evaluation |\n| `/reviews` | Architect Reviews; Review Findings |\n| `/llm` | LLM Gateway; Architect role execution; Work-order generation |\n| `/agents` | Agent Gateway; Agent Runs |\n| `/github` | GitHub App; GitHub webhooks; Pull Requests; CI integration |\n\nThe `/llm` module provides architect/LLM capabilities. The `/reviews` module owns persisted review records and findings.\n\n"""
          if "## Frozen module ownership" not in text:
              anchor = "Each module owns its domain entities and business rules.\n\nModules communicate through explicit application/domain interfaces rather than directly reaching into another module's internal implementation.\n"
              if anchor not in text:
                  raise SystemExit("Backend ownership anchor not found")
              text = text.replace(anchor, anchor + ownership, 1)

          architecture.write_text(text)

          lock = Path("spec/architecture-lock.md")
          lock.write_text("""# Architecture Lock\n\n## Status\n\nFROZEN\n\nThis document is authoritative for the frozen architectural rules of WorkflowOS.\n\n## Work item / Pull Request cardinality\n\n- A work item may have multiple PRs over its lifetime, preserving historical PR associations.\n- A work item may have only one active implementation PR at a time.\n- A PR may implement one or more work items, provided each work item is explicitly associated with that PR.\n\n## Workflow authority\n\n- `/workflows` owns the workflow state machine, legal transitions, and orchestration.\n- External agents and LLMs cannot directly mutate workflow state.\n- Workflow transitions are deterministic and idempotent.\n\n## Canonical workflow\n\n```text\nDRAFT\n→ READY\n→ ASSIGNED\n→ IMPLEMENTING\n→ PR_OPEN\n→ VERIFYING\n```\n\nFrom `VERIFYING`:\n- `VERIFICATION_FAILED` → `IMPLEMENTING`\n- `ARCHITECT_REVIEW`\n\nFrom `ARCHITECT_REVIEW`:\n- `CHANGES_REQUESTED` → `IMPLEMENTING`\n- `ARCHITECTURE_CHANGE_REQUIRED` → `ARCHITECTURE_CHANGE_REQUEST`\n- `APPROVED` → `MERGED` → `VERIFIED`\n\n`IMPLEMENTATION_BLOCKED` may occur during `ASSIGNED`, `IMPLEMENTING`, or `VERIFYING` and returns to `IMPLEMENTING` when resolved.\n\n`ARCHITECTURE_CHANGE_REQUIRED` is terminal for the current implementation attempt until the architecture change is resolved.\n\n## Architecture ownership\n\nThe `/architecture` module owns Architecture, ArchitectureVersion, ArchitectureDecision, and ArchitectureChangeRequest. Approved architecture changes create a new immutable architecture version. Frozen architecture versions are immutable.\n\n## Verification ownership\n\nThe `/verification` module owns verification runs, verification results, evidence, acceptance-criterion evaluation, and evidence-to-criterion mapping. GitHub Actions is an external CI provider. `/github` owns GitHub integration and CI result ingestion; `/verification` owns verification semantics.\n\n## Module boundaries\n\n- `/architecture`: Architecture Management, ADRs, Architecture Change Requests, Architecture Versions\n- `/specifications`: specification documents and specification lifecycle\n- `/requirements`: Requirements, Acceptance Criteria\n- `/work-items`: Work Items, Work Item Dependencies, Work Order state\n- `/workflows`: workflow state machine, legal state transitions, orchestration\n- `/verification`: verification, evidence, criterion evaluation\n- `/reviews`: Architect Reviews, Review Findings\n- `/llm`: LLM Gateway, Architect role execution, Work-order generation\n- `/agents`: Agent Gateway, Agent Runs\n- `/github`: GitHub App, GitHub webhooks, Pull Requests, CI integration\n\nThe `/llm` module provides architect/LLM capabilities. The `/reviews` module owns persisted review records and findings.\n\n## Existing frozen invariants\n\n- PostgreSQL is the authoritative WorkflowOS application/workflow state.\n- GitHub is authoritative for repository state.\n- Acceptance criteria require traceable evidence.\n- Frozen architecture versions are immutable.\n- Work items reference exactly one architecture version.\n- Tenant boundaries are enforced server-side.\n- Credentials and secrets are not ordinary application data.\n- Provider-specific LLM and agent behavior remains behind their gateways.\n- GitHub-specific behavior remains inside `/github`.\n""")

      - name: Commit specification changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- spec/architecture.md spec/architecture-lock.md
          git commit -m "docs: resolve Step 0 architecture blockers"
          git push origin chore/resolve-step0-architecture-blockers
