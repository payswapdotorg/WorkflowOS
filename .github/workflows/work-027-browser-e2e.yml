# WORK-027 Browser E2E CI for WorkflowOS.
#
# Runs the Playwright browser-level E2E test that proves the WORK-027
# external execution handoff flow through the real browser UI:
#
#   login → create project/architecture/requirement/work item → ready →
#   WorkItemPage → Start Implementation → Execution Mode dialog
#   (● Native / ○ External) → provider readiness grid → choose External +
#   Z.ai → POST /work-items/:id/execution → WorkflowOS shows handoff-ready →
#   Prepare External Session (one-time token issued + redeemed) →
#   execution package appears (repository / branch suggestion / deterministic
#   prompt expandable / verification requirements / return callback) →
#   native mode through the same dialog still produces an AgentRun.
#
# The test does NOT automate Z.ai — that belongs to the WORK-028 Companion
# extension. It proves the WorkflowOS handoff foundation is correct.
#
# Determinism: the test wires FakeAgentAdapter — no real GitHub/Vercel/OpenAI
# calls. Backend is Fastify + pglite + InMemoryQueue. Frontend is the real
# Vite SPA served by Playwright's webServer.
#
# On failure, the Playwright HTML report is uploaded as a CI artifact.
name: work-027-browser-e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: work027-browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: work-027 external handoff browser E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies (for Playwright webServer)
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers (chromium)
        run: bunx playwright install --with-deps chromium

      - name: Run WORK-027 external handoff browser E2E test
        # The test starts the Fastify backend on 127.0.0.1:3001 (the dev-proxy
        # target) + the Vite dev server on :5173 (Playwright webServer) +
        # pglite (real PostgreSQL compiled to WASM) + InMemoryQueue +
        # WorkerHost. No external services required.
        run: bunx playwright test tests/e2e-browser/work-027-external-handoff.spec.ts

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-work-027-report
          path: backend/playwright-report/
          retention-days: 7
