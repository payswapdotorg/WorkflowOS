# Minimal CI for WORK-001.
#
# Verifies the modular-monolith foundation on every pull request and on every
# push to `main`. Runs the backend test suite (unit + integration + static
# architecture checks), the TypeScript typecheck, and ESLint.
#
# Out of scope: deployment, release, or any broader CI infrastructure — those
# belong to later work items (e.g. WORK-023 deployable runtime).
name: backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: test / typecheck / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests (unit + integration + static architecture checks)
        run: bun run test

      - name: Run TypeScript typecheck
        run: bun run typecheck

      - name: Run ESLint
        run: bun run lint
