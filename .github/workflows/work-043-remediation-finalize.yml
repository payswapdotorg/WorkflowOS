name: WORK-043 remediation finalizer

on:
  push:
    branches:
      - feat/work-043-execution-eligibility

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, '[WORK-043-REMEDIATED]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Apply WORK-043 corrections
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path('.')

          # A. Eligibility evaluation must be observational: never INSERT a policy row.
          p = root / 'backend/src/execution-policy/internal/default-execution-policy-service.ts'
          s = p.read_text()
          old = '''    if (!policy && organizationId) {
      policy = await this.deps.repository.insertDefaultProjectPolicy(organizationId, projectId);
    }
    if (!policy) {
'''
          new = '''    if (!policy) {
'''
          if old not in s:
              raise SystemExit('eligibility default-policy insertion anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # B. Organization scope is mandatory at the policy seam.
          p = root / 'backend/src/execution-policy/types.ts'
          s = p.read_text()
          s = s.replace('  readonly organizationId?: string | null;', '  readonly organizationId: string;')
          s = re.sub(
              r"\* `workItemId` supplies[\s\S]*?\*/\nexport interface CandidateEligibilityInput",
              '''* `workItemId` supplies the task profile context (the handoff passes the
 * EXISTING execution's work item — the logical task does not change across
 * a mode handoff; §33.7). `userId` (optional — the handoff actor) resolves
 * the user-scoped subscription/access-profile constraints.
 * `organizationId` is REQUIRED and MUST be resolved from the authoritative
 * Project → Organization relation; callers may not omit or null it.
 */
export interface CandidateEligibilityInput''',
              s,
              count=1,
          )
          p.write_text(s)

          # C. Add provider-independent final admission contract.
          p = root / 'backend/src/modules/agents/internal/execution.types.ts'
          s = p.read_text()
          anchor = 'export interface ExecutionProvider {\n'
          idx = s.index(anchor)
          close = s.index('}\n\n', idx) + 3
          if 'export interface ExecutionAdmissionPort' not in s:
              admission = '''
/**
 * WORK-043: final execution admission gate. Eligibility answers whether a
 * candidate satisfies the current hard constraints; admission is the distinct
 * execution-side boundary immediately before provider dispatch.
 */
export interface ExecutionAdmissionResult {
  readonly admitted: boolean;
  readonly reason: string;
  readonly policyVersion: number | null;
  readonly blockingReasons: readonly {
    readonly category: string;
    readonly constraint: string;
    readonly reason: string;
  }[];
}

export interface ExecutionAdmissionPort {
  admit(task: ExecutionTask): Promise<ExecutionAdmissionResult>;
}
'''
              s = s[:close] + admission + s[close:]
              p.write_text(s)

          # D. Default admission service.
          p = root / 'backend/src/execution-policy/internal/default-execution-admission-service.ts'
          if not p.exists():
              p.write_text('''/**
 * WORK-043 — final execution admission boundary.
 * Re-evaluates current hard constraints immediately before provider dispatch.
 */
import type { Logger } from '@platform/logger.js';
import type { ExecutionTask, ExecutionAdmissionPort, ExecutionAdmissionResult } from '@modules/agents';
import type { ExecutionPolicyService } from '../types.js';

export interface ProjectOrganizationResolver {
  getOrganizationId(projectId: string): Promise<string | null>;
}

export interface DefaultExecutionAdmissionServiceDeps {
  readonly executionPolicyService: ExecutionPolicyService;
  readonly organizationResolver: ProjectOrganizationResolver;
  readonly logger: Logger;
}

export class DefaultExecutionAdmissionService implements ExecutionAdmissionPort {
  constructor(private readonly deps: DefaultExecutionAdmissionServiceDeps) {}

  async admit(task: ExecutionTask): Promise<ExecutionAdmissionResult> {
    const organizationId = await this.deps.organizationResolver.getOrganizationId(task.projectId);
    if (!organizationId) {
      return {
        admitted: false,
        reason: 'execution-admission-organization-unresolvable',
        policyVersion: null,
        blockingReasons: [{
          category: 'organization',
          constraint: 'project_organization_resolution',
          reason: `Organization for project ${task.projectId} could not be resolved.`,
        }],
      };
    }
    try {
      const verdict = await this.deps.executionPolicyService.evaluateCandidateEligibility({
        organizationId,
        projectId: task.projectId,
        workItemId: task.workItemId,
        provider: task.provider,
        model: task.model,
        executionMode: task.mode,
        userId: null,
      });
      return {
        admitted: verdict.eligibility.eligible,
        reason: verdict.eligibility.eligible
          ? 'execution-admitted-current-hard-constraints'
          : 'execution-admission-hard-constraint-block',
        policyVersion: verdict.policyVersion,
        blockingReasons: verdict.eligibility.blockingReasons,
      };
    } catch (error) {
      this.deps.logger.error('execution-admission.evaluation-failed', {
        projectId: task.projectId,
        executionId: task.executionId,
        error: (error as Error).message,
      });
      return {
        admitted: false,
        reason: 'execution-admission-evaluation-failed',
        policyVersion: null,
        blockingReasons: [{
          category: 'policy',
          constraint: 'evaluation',
          reason: (error as Error).message,
        }],
      };
    }
  }
}
''')

          # E. Export admission service and contracts.
          p = root / 'backend/src/execution-policy/index.ts'
          s = p.read_text()
          if 'ExecutionAdmissionPort,' not in s:
              s = s.replace('  CandidateEligibilityResult,\n', '  CandidateEligibilityResult,\n  ExecutionAdmissionResult,\n  ExecutionAdmissionPort,\n', 1)
          if "export { DefaultExecutionAdmissionService }" not in s:
              s = s.replace('export { DefaultExecutionEligibilityService }', "export { DefaultExecutionAdmissionService } from './internal/default-execution-admission-service.js';\nexport { DefaultExecutionEligibilityService }", 1)
          p.write_text(s)

          # F. Cross-mode handoff: require org scope and resolve it authoritatively.
          p = root / 'backend/src/modules/agents/internal/default-cross-mode-handoff-service.ts'
          s = p.read_text()
          s = s.replace('  evaluateCandidateEligibility?(input: {', '  evaluateCandidateEligibility(input: {')
          s = s.replace('    organizationId?: string | null;', '    organizationId: string;')
          if 'interface CrossModeProjectOrganizationResolver' not in s:
              marker = 'export interface CrossModeAgentProviderRegistryPort {'
              resolver = '''/** WORK-043: authoritative Project → Organization resolver. */
export interface CrossModeProjectOrganizationResolver {
  getOrganizationId(projectId: string): Promise<string | null>;
}

'''
              s = s.replace(marker, resolver + marker, 1)
          if 'readonly organizationResolver: CrossModeProjectOrganizationResolver;' not in s:
              s = s.replace('  readonly executionPolicyService: CrossModeExecutionPolicyPort;\n', '  readonly executionPolicyService: CrossModeExecutionPolicyPort;\n  /** WORK-043: authoritative project→organization scope resolver. */\n  readonly organizationResolver: CrossModeProjectOrganizationResolver;\n', 1)
          old = '''    const seam = this.deps.executionPolicyService.evaluateCandidateEligibility;
    if (!seam) {
      // Pre-WORK-043 port — the destination gate is not wired. Compose a
      // skip marker so the log row records the gate's absence honestly.
      return composeSummary(policySummary, {
        destinationEligibility: { status: 'not_evaluated', eligible: null, reason: 'WORK-043 destination eligibility seam not wired' },
      });
    }
    let verdict;
    try {
      verdict = await seam.call(
        this.deps.executionPolicyService,
        {
          // No organization context at the handoff service layer: the
          // org-scoped families are inactive; the per-execution agent-policy
          // gate (step 6) already enforces the external domain STRICTER.
          organizationId: null,
          projectId: record.projectId,
          workItemId: record.workItemId,
          provider,
          model,
          executionMode: input.targetMode,
          userId: actor.userId,
        },
      );
'''
          new = '''    const organizationId = await this.deps.organizationResolver.getOrganizationId(record.projectId);
    if (!organizationId) {
      throw new CrossModeHandoffError(
        `handoff-ineligible-destination: organization for project ${record.projectId} could not be resolved — failing closed`,
        'handoff-ineligible-destination',
      );
    }
    let verdict;
    try {
      verdict = await this.deps.executionPolicyService.evaluateCandidateEligibility({
        organizationId,
        projectId: record.projectId,
        workItemId: record.workItemId,
        provider,
        model,
        executionMode: input.targetMode,
        userId: actor.userId,
      });
'''
          if old in s:
              s = s.replace(old, new, 1)
          else:
              raise SystemExit('handoff destination gate anchor not found')
          p.write_text(s)

          # G. Final admission in ExecutionService.
          p = root / 'backend/src/modules/agents/internal/execution-service.ts'
          s = p.read_text()
          if 'ExecutionAdmissionPort' not in s.split('from',1)[0]:
              s = s.replace('  CreateExecutionRecordInput,\n', '  CreateExecutionRecordInput,\n  ExecutionAdmissionPort,\n', 1)
          if 'readonly executionAdmission: ExecutionAdmissionPort;' not in s:
              s = s.replace('  readonly sessionService?: ExecutionSessionService;\n', '  readonly sessionService?: ExecutionSessionService;\n  /** WORK-043: mandatory final hard-constraint admission before provider dispatch. */\n  readonly executionAdmission: ExecutionAdmissionPort;\n', 1)
          old = '''    // 3. Dispatch through the provider boundary.
    let submission;
'''
          new = '''    // 3. Final admission through the execution-side boundary.
    // The CURRENT hard constraints are rechecked immediately before any provider side effect.
    const admission = await this.deps.executionAdmission.admit(task);
    if (!admission.admitted) {
      const reason = admission.blockingReasons.map((b) => `${b.category}/${b.constraint}: ${b.reason}`).join('; ');
      throw new Error(`execution-admission-denied: ${admission.reason}${reason ? ` (${reason})` : ''}`);
    }

    // 3b. Dispatch through the provider boundary.
    let submission;
'''
          if old not in s:
              raise SystemExit('execution dispatch anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # H. Composition root: wire admission + authoritative project organization.
          p = root / 'backend/src/app.ts'
          s = p.read_text()
          if 'DefaultExecutionAdmissionService' not in s:
              s = s.replace('  DefaultExecutionPolicyService,\n', '  DefaultExecutionPolicyService,\n  DefaultExecutionAdmissionService,\n', 1)
          admission_ctor = '''    const executionAdmissionService = new DefaultExecutionAdmissionService({
      executionPolicyService,
      organizationResolver: {
        getOrganizationId: async (projectId) => (await projectRepository!.findById(projectId))?.organizationId ?? null,
      },
      logger,
    });
'''
          if 'const executionAdmissionService = new DefaultExecutionAdmissionService' not in s:
              s = s.replace('    executionService = new DefaultExecutionService({\n', admission_ctor + '    executionService = new DefaultExecutionService({\n', 1)
          if 'executionAdmission: executionAdmissionService' not in s:
              s = s.replace('      sessionService: executionSessionService,\n    });\n', '      sessionService: executionSessionService,\n      executionAdmission: executionAdmissionService,\n    });\n', 1)
          # identify the cross-mode constructor by the existing policy dep near it
          needle = '      executionPolicyService,\n      agentProviderRegistryService,\n'
          replacement = '''      executionPolicyService,
      organizationResolver: {
        getOrganizationId: async (projectId) => (await projectRepository!.findById(projectId))?.organizationId ?? null,
      },
      agentProviderRegistryService,
'''
          if 'organizationResolver: {' not in s or s.count('organizationResolver: {') < 2:
              s = s.replace(needle, replacement, 1)
          p.write_text(s)

          # I. Add focused regression proving admission gates provider submission.
          test = root / 'backend/tests/integration/execution-policy/execution-admission.regression.test.ts'
          if not test.exists():
              test.write_text('''import { describe, expect, it, vi } from 'vitest';
import { DefaultExecutionAdmissionService } from '../../src/execution-policy/internal/default-execution-admission-service.js';

describe('WORK-043 execution admission boundary', () => {
  const logger = { error: vi.fn(), info: vi.fn(), warn: vi.fn(), debug: vi.fn() } as never;
  it('fails closed without an authoritative organization', async () => {
    const evaluateCandidateEligibility = vi.fn();
    const service = new DefaultExecutionAdmissionService({
      executionPolicyService: { evaluateCandidateEligibility } as never,
      organizationResolver: { getOrganizationId: async () => null },
      logger,
    });
    const result = await service.admit({ projectId: 'p', executionId: 'e' } as never);
    expect(result.admitted).toBe(false);
    expect(evaluateCandidateEligibility).not.toHaveBeenCalled();
  });

  it('uses the authoritative organization when evaluating current constraints', async () => {
    const evaluateCandidateEligibility = vi.fn().mockResolvedValue({
      eligibility: { eligible: false, status: 'quota_exhausted', blockingReasons: [{ category: 'quota', constraint: 'daily', reason: 'exhausted' }] },
      policyVersion: 4,
    });
    const service = new DefaultExecutionAdmissionService({
      executionPolicyService: { evaluateCandidateEligibility } as never,
      organizationResolver: { getOrganizationId: async () => 'org-authoritative' },
      logger,
    });
    const result = await service.admit({ projectId: 'p', executionId: 'e', workItemId: 'w', provider: 'fake', model: 'm', mode: 'native' } as never);
    expect(result.admitted).toBe(false);
    expect(evaluateCandidateEligibility).toHaveBeenCalledWith(expect.objectContaining({ organizationId: 'org-authoritative' }));
  });
});
''')

          # Remove both temporary remediation workflows from the resulting commit.
          for wf in [
              root / '.github/workflows/work-043-remediation-apply.yml',
              root / '.github/workflows/work-043-remediation-finalize.yml',
          ]:
              if wf.exists(): wf.unlink()
          print('WORK-043 corrections applied')
      - name: Verify
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          tsc_out=$(bunx tsc --noEmit --pretty false 2>&1 || true)
          bad=$(printf '%s\n' "$tsc_out" | grep -v 'tests/e2e-browser/work-032-benchmark.spec.ts' || true)
          if [ -n "$bad" ]; then printf '%s\n' "$tsc_out"; exit 1; fi
          bunx eslint src/execution-policy src/modules/agents/internal/execution-service.ts src/modules/agents/internal/default-cross-mode-handoff-service.ts src/app.ts tests/integration/execution-policy/execution-admission.regression.test.ts
          bunx vitest run tests/integration/execution-policy/execution-admission.regression.test.ts tests/integration/execution-policy/execution-eligibility-engine.integration.test.ts tests/integration/execution-policy/execution-eligibility-constraints.regression.test.ts
      - name: Commit remediation
        shell: bash
        run: |
          git config user.name 'WORK-043 remediation bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(WORK-043): enforce observational eligibility, tenant scope, and final admission [WORK-043-REMEDIATED]'
          git push origin HEAD:feat/work-043-execution-eligibility
