# WorkflowOS Companion extension E2E CI (WORK-028 + WORK-029).
#
# Builds the WorkflowOS Companion browser extension, then runs the Playwright
# test that loads it UNPACKED into a persistent Chromium context and proves
# the full loop against the real backend + real Vite SPA:
#
#   WorkflowOS "Open with Companion" → /companion/handoff#ref=… → extension
#   bridge content script → background service worker redeems the ONE-TIME
#   handoff token (POST /api/companion/redeem, no API key) → fake provider
#   extension page runs a deterministic lifecycle → execution events reported
#   with the scoped x-callback-token → WorkflowOS execution completes →
#   popup shows the session → replayed handoff ref rejected (409).
#
# WORK-030 (ChatGPT adapter, PR #33-corrected): implementation targets the
# CODING surface — the adapter opens its own LOCAL fixture server
# (127.0.0.1:3778) with a /codex/ coding-agent fixture (task composer,
# data-testid send/stop, /codex/<id> task URLs) → surface detected →
# digest-verified single injection → deterministic progress → completion →
# WorkflowOS completed event → popup; login wall → BLOCKED "Please sign in
# to ChatGPT."; Chat-only fixture → BLOCKED "ChatGPT coding environment
# unavailable or unverified." with ZERO submits (no silent fallback); XSS
# inert.
#
# WORK-029 (Z.ai adapter): the adapter opens a LOCAL fixture server
# (127.0.0.1:3777) reproducing the OBSERVED chat.z.ai DOM → provider
# detected as Z.ai → prompt injected (digest verified in-page) → sent
# EXACTLY ONCE (fixture counter) → deterministic agent progress → completion
# detected → WorkflowOS receives started/progress/completed → popup shows the
# Z.ai session; login-wall fixture → BLOCKED "Please sign in to Z.ai." with
# zero submissions; XSS payloads stay inert. No live Z.ai dependency.
#
# Deterministic: no real Z.ai/ChatGPT/Claude interaction (the fake provider
# is an extension page; provider adapters for real platforms are WORK-029+).
#
# On failure, the Playwright HTML report is uploaded as a CI artifact.
name: companion-extension-e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: companion extension E2E (WORK-028 + 029 + 030)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Build the Companion extension
        working-directory: extension
        run: |
          bun install
          bun run typecheck
          bun run lint
          bun run test
          bun run build

      - name: Install frontend dependencies (for the Playwright webServer)
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers (chromium)
        working-directory: backend
        run: bunx playwright install --with-deps chromium

      - name: Run companion extension E2E suite (WORK-028 + WORK-029)
        working-directory: backend
        run: bunx playwright test --config playwright-extension.config.ts

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-work-028-extension-report
          path: backend/playwright-report
          retention-days: 7
