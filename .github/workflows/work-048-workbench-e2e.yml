# WORK-048 Browser E2E CI for WorkflowOS.
#
# Runs the Playwright browser-level E2E test that proves the Developer
# Workbench through the real browser UI against a real backend topology
# (Fastify API on 127.0.0.1:3001 + the Vite dev server on :5173 via the
# Playwright webServer + pglite PostgreSQL + InMemoryQueue + WorkerHost):
#
#   login → the Workbench overview renders (project identity, the attention
#   derivation over the authoritative work graph, EXPLICIT unavailability for
#   the unwired runtime authority — missing data is never invented) →
#   the Work Graph renders the fact-based groups (blocked / in flight /
#   ready / draft / completed) from the WORK-048 read model →
#   the rollups render authoritative records (safe execution, the
#   GitHub-derived PR identity, the /verification run, the /reviews record;
#   deployments degrade to the explicit empty state) →
#   the drill-down: Workbench → work item page → the WORK-048 sections
#   (Objective, Dependencies, Merge Gates, the ADVISORY routing
#   recommendation — advisory framing, never a decision) →
#   browser-level tenant isolation: user A opening user B's project
#   workbench sees ONLY the degraded unavailable states — zero project B
#   data (server-side authorization; the frontend has no authority).
#
# Determinism: fake adapters only; no external services.
#
# On failure, the Playwright HTML report is uploaded as a CI artifact.
name: work-048-workbench-browser-e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: work-048 workbench browser E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies (for Playwright webServer)
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers (chromium)
        run: bunx playwright install --with-deps chromium

      - name: Run WORK-048 workbench browser E2E test
        # The test starts the Fastify backend on 127.0.0.1:3001 (the
        # dev-proxy target) + the Vite dev server on :5173 (Playwright
        # webServer) + pglite + InMemoryQueue + WorkerHost. The runtime /
        # planning / maintenance route groups are deliberately UNWIRED so
        # their absence renders as explicit "unavailable" states (missing
        # backend data is never invented). No external services required.
        run: bunx playwright test tests/e2e-browser/work-048-workbench.spec.ts

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-work-048-report
          path: backend/playwright-report/
          retention-days: 7
