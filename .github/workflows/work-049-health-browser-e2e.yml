# WORK-049 Browser E2E CI for WorkflowOS.
#
# Runs the Playwright browser-level E2E test that proves the Project Health &
# Maintenance UX (the Workbench Health tab) through the real browser UI
# against a real backend topology (Fastify API on 127.0.0.1:3001 + the Vite
# dev server on :5173 via the Playwright webServer + pglite PostgreSQL +
# InMemoryQueue + WorkerHost):
#
#   login → the Health tab renders FINDINGS from authoritative facts (the
#   maintenance authority's open critical signal with what/why/severity/
#   evidence, the verification authority's failed run, the dependency
#   authority's blocked item) → failed health reads are DISTINCT from genuine
#   empty health (the UNWIRED runtime authority withholds the all-healthy
#   conclusion — "Health assessment incomplete", never a fabricated
#   "No health findings") → open maintenance findings remain distinguishable
#   from actual completed Work Items (the completed signal is done work,
#   never a finding) → what should happen next (the maintenance authority's
#   open Work Item as the governed path; NO mutation trigger anywhere —
#   recommendations cannot mutate state) → browser-level tenant isolation:
#   user A opening user B's project Health tab sees ONLY degraded states —
#   zero project B data (including the SECRET maintenance signal).
#
# Determinism: fake adapters only; no external services.
#
# On failure, the Playwright HTML report is uploaded as a CI artifact.
name: work-049-health-browser-e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: work-049 health browser E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies (for Playwright webServer)
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers (chromium)
        run: bunx playwright install --with-deps chromium

      - name: Run WORK-049 health browser E2E test
        # The test starts the Fastify backend on 127.0.0.1:3001 (the
        # dev-proxy target) + the Vite dev server on :5173 (Playwright
        # webServer) + pglite + InMemoryQueue + WorkerHost. The maintenance
        # route group IS wired (the real WORK-041 authority); the runtime /
        # planning route groups are deliberately UNWIRED so their failures
        # render as explicit "unavailable" states (missing backend data is
        # never invented). No external services required.
        run: bunx playwright test tests/e2e-browser/work-049-health.spec.ts

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-work-049-report
          path: backend/playwright-report/
          retention-days: 7
