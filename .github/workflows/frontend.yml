# Frontend CI for WorkflowOS (WORK-022).
#
# Verifies the Vite + React web application on every pull request and on every
# push to `main`. Runs the TypeScript typecheck, ESLint, the production build
# (so a broken build can never merge), and the rendered-UI test suite
# (Vitest + jsdom + @testing-library/react).
#
# The backend CI workflow (backend.yml) is not sufficient on its own — a
# backend-only green run does NOT verify the web application builds or that
# the rendered React views display authoritative backend state. This workflow
# closes that gap (PR #21 issue 1).
name: frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / lint / build / test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: bun run typecheck

      - name: Run ESLint
        run: bun run lint

      - name: Run production build
        # The frontend must build cleanly. A passing typecheck alone does not
        # prove the Vite production bundle compiles — this step does.
        run: bun run build

      - name: Run rendered-UI tests
        # Vitest + jsdom + @testing-library/react mounts the actual React
        # pages and asserts the rendered DOM against a real Fastify backend.
        # This is genuine rendered-UI coverage, NOT direct API testing
        # (PR #21 issue 2).
        run: bun run test
