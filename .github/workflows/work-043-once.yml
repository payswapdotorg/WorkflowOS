name: WORK-043 once

on:
  push:
    branches:
      - feat/work-043-execution-eligibility

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, '[WORK-043-REMEDIATED]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Apply
        run: python3 scripts/work-043-remediate.py
      - name: Typecheck
        working-directory: backend
        run: |
          set -euo pipefail
          tsc_out=$(bunx tsc --noEmit --pretty false 2>&1 || true)
          bad=$(printf '%s\n' "$tsc_out" | grep -v 'tests/e2e-browser/work-032-benchmark.spec.ts' || true)
          if [ -n "$bad" ]; then
            printf '%s\n' "$tsc_out"
            exit 1
          fi
      - name: Lint
        working-directory: backend
        run: bunx eslint src/execution-policy src/modules/agents/internal/execution-service.ts src/modules/agents/internal/default-cross-mode-handoff-service.ts src/app.ts tests/integration/execution-policy/execution-admission.regression.test.ts
      - name: Admission regression
        working-directory: backend
        run: bunx vitest run tests/integration/execution-policy/execution-admission.regression.test.ts
      - name: Existing eligibility regressions
        working-directory: backend
        run: bunx vitest run tests/integration/execution-policy/execution-eligibility-engine.integration.test.ts tests/integration/execution-policy/execution-eligibility-constraints.regression.test.ts
      - name: Architecture invariants
        working-directory: backend
        run: bunx vitest run tests/architecture/static-architecture.test.ts
      - name: Commit
        run: |
          rm -f .github/workflows/work-043-remediation-apply.yml .github/workflows/work-043-remediation-finalize.yml .github/workflows/work-043-apply2.yml
          rm -f .github/workflows/work-043-once.yml scripts/work-043-remediate.py
          git config user.name 'WORK-043 remediation bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(WORK-043): enforce observational eligibility, tenant scope, and final admission [WORK-043-REMEDIATED]'
          git push origin HEAD:feat/work-043-execution-eligibility
