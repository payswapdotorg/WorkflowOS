# WORK-050 Browser E2E CI for WorkflowOS.
#
# Runs the Playwright browser-level E2E test that proves the Unified
# Execution UX (the Work Item's unified execution section) through the real
# browser UI against a real backend topology (Fastify API on 127.0.0.1:3001
# + the Vite dev server on :5173 via the Playwright webServer + pglite
# PostgreSQL + InMemoryQueue + WorkerHost):
#
#   login → the unified execution section renders the AUTHORITATIVE facts
#   (the execution record's own provider/model/mode as "Actually selected",
#   the prior native execution — parity through the same model, the WORK-042
#   handoff log's own record, the WORK-046 delegated units with their roles,
#   the verification authority's own run state, and the workflow authority's
#   next-action facts) → the UNWIRED advisory groups (WORK-044 routing /
#   WORK-047 intelligence / WORK-043 policy) render EXPLICIT unavailable
#   errors — never a fabricated recommendation → the unified view renders NO
#   mutation trigger (recommendations cannot mutate state; the only action
#   is the pre-existing External Handoff path gated on the authority's own
#   handoff_ready record) → BROWSER-LEVEL tenant isolation: user A opening
#   user B's work item page sees ONLY the page-level error — zero project B
#   data (including the SECRET execution).
#
# Determinism: fake adapters only; no external services.
#
# On failure, the Playwright HTML report is uploaded as a CI artifact.
name: work-050-unified-execution-browser-e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: work-050 unified execution browser E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies (for Playwright webServer)
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers (chromium)
        run: bunx playwright install --with-deps chromium

      - name: Run WORK-050 unified execution browser E2E test
        # The test starts the Fastify backend on 127.0.0.1:3001 (the
        # dev-proxy target) + the Vite dev server on :5173 (Playwright
        # webServer) + pglite + InMemoryQueue + WorkerHost. The execution +
        # handoff-read + delegation + verification + workflow route groups ARE
        # wired (real authorities); the advisory route groups (routing /
        # intelligence / policy) are deliberately UNWIRED so their failures
        # render as explicit "unavailable" states (missing backend data is
        # never invented). No external services required.
        run: bunx playwright test tests/e2e-browser/work-050-unified-execution.spec.ts

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-work-050-report
          path: backend/playwright-report/
          retention-days: 7
