# WorkflowOS frontend nginx config (WORK-023).
#
# Serves the built SPA (Vite production bundle) and proxies API requests
# to the Backend API container. The frontend calls /api/* — nginx strips
# the /api prefix and forwards to the backend (whose routes are at the
# root: /projects/:id, /health, etc.).
#
# The SPA uses client-side routing (react-router), so any non-asset,
# non-API request falls back to index.html.

upstream workflowos_api {
    server api:3001;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- API proxy ---
    # /api/projects/123 → http://api:3001/projects/123
    location /api/ {
        proxy_pass http://workflowos_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Fastify may take a moment to respond on heavy routes; give it room.
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # --- Static assets (Vite hashed files) ---
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- SPA fallback ---
    # Any other path serves index.html so react-router can handle client-side
    # routing. This is the standard SPA pattern.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
