<!DOCTYPE html>
<!--
  WORK-031: Claude CONVERSATIONAL fixture — reproduces the DOM structure of
  https://claude.ai per the contract documented in
  src/providers/claude/README.md (2026-08-24 research; live inspection was
  blocked from the build environment). Served at http://127.0.0.1:3779 by
  the WORK-030 E2E harness.

  Observed anchors reproduced:
    - div#prompt-textarea[contenteditable=true] (ProseMirror composer)
    - button[data-testid="send-button"][disabled] (enables on input)
    - button[data-testid="stop-button"] while generating (streaming marker)
    - conversation URLs /c/<uuid>
    - login wall variant (?wall=login): composer hidden, Log in visible

  Fixture-only behavior (mimics the product contract for testing):
    - real submits counted ONLY via the send button click on a non-empty
      composer (window.__chatgptFixture.submits)
    - deterministic agent: streaming → progress (branch/commit/PR/tests) →
      done; variants: ?fail=1 ?confirm=1 ?xss=1
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Claude Fixture</title>
    <style>
      body { font-family: system-ui; margin: 0; display: flex; }
      #sidebar { width: 220px; border-right: 1px solid #eee; padding: 10px; }
      #main { flex: 1; display: flex; flex-direction: column; height: 100vh; }
      #transcript { flex: 1; overflow-y: auto; padding: 16px; }
      .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; background: #f6f6f7; white-space: pre-wrap; }
      .msg.assistant { background: #f0f7ff; }
      #composer { border-top: 1px solid #eee; padding: 12px; display: flex; gap: 8px; align-items: flex-end; }
      #prompt-textarea { flex: 1; min-height: 48px; max-height: 200px; border: 1px solid #d9d9e3; border-radius: 10px; padding: 10px; outline: none; }
      [role="alert"] { background: #fee2e2; color: #991b1b; padding: 8px 12px; border-radius: 6px; margin: 8px 0; }
      [role="alertdialog"] { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: grid; place-items: center; }
      [role="alertdialog"] > div { background: #fff; padding: 20px; border-radius: 10px; }
      .login-btn { position: absolute; top: 10px; right: 12px; }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <a href="/" aria-label="New chat">New chat</a>
      <nav aria-label="Chat history">Chat history</nav>
    </div>
    <div id="main">
      <div id="topbar">
        <button aria-label="Model">Claude Sonnet</button>
        <button class="login-btn" id="login-btn" hidden>Log in</button>
      </div>
      <main id="transcript"></main>
      <div id="error-slot"></div>
      <form id="composer-form">
        <div id="composer">
          <div id="prompt-textarea" class="ProseMirror" contenteditable="true" role="textbox" aria-label="Write your prompt to Claude" data-placeholder="Ask anything"></div>
          <button type="button" aria-label="Send message" id="send-btn" disabled aria-label="Send prompt">➤</button>
          <button type="button" aria-label="Stop response" id="stop-btn" hidden>■</button>
        </div>
      </form>
    </div>

    <script src="./claude-chat-agent.js"></script>
  </body>
</html>
